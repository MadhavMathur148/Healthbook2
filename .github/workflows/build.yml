name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the build job can write, and only to publish a release.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  leak-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: pip install "playwright==1.63.0"
      - name: Nothing technical on screen, nothing leaves the phone
        run: |
          python tests/leak_sweep.py
          python tests/no_tech_leak.py
      - name: Easy days and experiments
        run: python tests/lab_test.py
      - name: Hostile data can't run code
        run: python tests/hostile_data.py

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install exactly what the lockfile says (integrity-checked)
        run: npm ci --ignore-scripts
      - name: No known vulnerabilities in shipped libraries
        run: npm audit --omit=dev --audit-level=moderate
      - name: Bundled libraries match the official packages byte for byte
        run: |
          cmp www/vendor/supabase.js node_modules/@supabase/supabase-js/dist/umd/supabase.js
          cmp www/vendor/jspdf.umd.min.js node_modules/jspdf/dist/jspdf.umd.min.js
      - name: No keys or private files committed
        run: |
          if git ls-files | grep -E '\.(jks|keystore|p12|pem|key|pfx)$|(^|/)\.env($|\.)|google-services\.json'; then echo "::error::A key or secret file is committed"; exit 1; fi
          if git grep -nE 'sb_secret_|service_role.{0,6}["'"'"']ey|-----BEGIN [A-Z ]*PRIVATE KEY|storePassword +"' -- ':!.github' ':!www/vendor' ':!package-lock.json'; then echo "::error::A secret value is committed"; exit 1; fi

  build:
    needs: [leak-check, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci --ignore-scripts

      - name: Copy app into Android project
        run: npx cap sync android

      - name: Load release key
        env:
          HB_PASS: ${{ secrets.HB_SIGNING_PASSPHRASE }}
        run: |
          # The signing key only ever exists inside this build. The repo holds it encrypted
          # with a passphrase that lives in your password manager and in the repo's secrets.
          if [ -z "$HB_PASS" ]; then
            echo "::error::Add the HB_SIGNING_PASSPHRASE secret in Settings → Secrets and variables → Actions, then run this again."
            exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"; ENC=android/app/release.keystore.enc
          if [ ! -f "$ENC" ]; then
            keytool -genkeypair -v -storetype PKCS12 -keystore "$KS" -alias healthbook \
              -keyalg RSA -keysize 4096 -validity 11000 -dname "CN=Healthbook" \
              -storepass:env HB_PASS -keypass:env HB_PASS
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:HB_PASS -in "$KS" -out "$ENC"
            git config user.name "healthbook-build"; git config user.email "healthbook-build@users.noreply.github.com"
            git add "$ENC"; git commit -m "Add encrypted release key [skip ci]"; git push
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:HB_PASS -in "$ENC" -out "$KS" \
              || { echo "::error::The HB_SIGNING_PASSPHRASE secret doesn't unlock the release key."; exit 1; }
          fi
          echo "HB_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          HB_PASS: ${{ secrets.HB_SIGNING_PASSPHRASE }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Healthbook.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Healthbook-apk
          path: Healthbook.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: build-${{ github.run_number }}
          name: Healthbook 1.0.${{ github.run_number }}
          body: Download Healthbook.apk below and open it on your phone to install or update.
          files: Healthbook.apk
          make_latest: true
